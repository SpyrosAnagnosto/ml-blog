
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title }}</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #242424;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      line-height: 1.8;
    }

    header {
      padding: 24px 32px;
      border-bottom: 1px solid #eeeeee;
      font-family: Arial, sans-serif;
    }

    header a {
      color: #242424;
      font-size: 19px;
      font-weight: 700;
      text-decoration: none;
    }

    main {
      max-width: 780px;
      margin: 65px auto;
      padding: 0 24px;
    }

    h1, h2, h3 {
      font-family: Arial, sans-serif;
      line-height: 1.3;
      letter-spacing: -0.5px;
      color: #242424;
    }

    h1 { font-size: 40px; }
    h2 { font-size: 28px; margin-top: 45px; }
    h3 { font-size: 23px; margin-top: 32px; }

    p { margin: 24px 0; }

    a {
      color: #1671aa;
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    img, svg {
      max-width: 100%;
      height: auto;
    }

    pre {
      background: #f6f8fa;
      border: 1px solid #eaeaea;
      border-radius: 8px;
      padding: 20px;
      overflow-x: auto;
      font-size: 14px;
      line-height: 1.6;
    }

    code {
      font-family: "DejaVu Sans Mono", Consolas, monospace;
      font-size: 0.85em;
    }

    :not(pre) > code {
      background: #f3f3f3;
      padding: 2px 5px;
      border-radius: 4px;
    }

    blockquote {
      border-left: 3px solid #242424;
      margin: 30px 0;
      padding-left: 20px;
      color: #666;
      font-style: italic;
    }

    footer {
      max-width: 780px;
      margin: 80px auto 25px;
      padding: 20px 24px;
      border-top: 1px solid #eeeeee;
      font: 13px Arial, sans-serif;
      color: #888;
    }

    @media (max-width: 600px) {
      main { margin: 35px auto; }
      h1 { font-size: 32px; }
      body { font-size: 17px; }
    }
  </style>
  {% if page.math %}
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  {% endif %}
</head>

<body>
  <header>
    <a href="{{ '/' | relative_url }}">
      {{ site.title }}
    </a>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    © {{ site.title }} · Built with GitHub Pages
  </footer>
</body>
</html>
